[package]
name = "openvnc-central"
description = "Servidor central OpenVNC (on-premises): usuarios, grupos, maquinas, permissoes e tickets."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "openvnc-central"
path = "src/main.rs"

[dependencies]
openvnc-security.workspace = true
openvnc-transport.workspace = true
tokio.workspace = true
rcgen.workspace = true
sha2.workspace = true
rand.workspace = true
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ring = "0.17"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
