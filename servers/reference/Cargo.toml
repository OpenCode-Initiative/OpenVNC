[package]
name = "openvnc-server"
description = "Servidor RFB 3.8 de referencia do OpenVNC."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "openvnc-server"
path = "src/main.rs"

[dependencies]
openvnc-core.workspace = true
openvnc-framebuffer.workspace = true
openvnc-codecs.workspace = true
openvnc-rfb.workspace = true
openvnc-platform.workspace = true
openvnc-security.workspace = true
openvnc-transport.workspace = true
openvnc-protocol.workspace = true
sha2.workspace = true
openvnc-client.workspace = true
flate2.workspace = true
quinn.workspace = true
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde = { version = "1", features = ["derive"] }
toml = "0.8"
getrandom = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_Controls_Dialogs",
  "Win32_Security_Cryptography",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[features]
default = ["h264"]
# Codificacao de video H.264 no protocolo nativo
h264 = ["openvnc-codecs/h264"]
wayland = ["openvnc-platform/wayland"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[build-dependencies]
embed-resource = "3"
