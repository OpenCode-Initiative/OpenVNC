[package]
name = "openvnc-server"
description = "Servidor RFB 3.8 de referencia do OpenVNC."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "openvnc-server"
path = "src/main.rs"

[dependencies]
openvnc-core.workspace = true
openvnc-framebuffer.workspace = true
openvnc-codecs.workspace = true
openvnc-rfb.workspace = true
openvnc-platform.workspace = true
openvnc-security.workspace = true
openvnc-transport.workspace = true
openvnc-protocol.workspace = true
flate2.workspace = true
quinn.workspace = true
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde = { version = "1", features = ["derive"] }
toml = "0.8"
getrandom = "0.2"

[features]
default = ["h264"]
# Codificacao de video H.264 no protocolo nativo
h264 = ["openvnc-codecs/h264"]
wayland = ["openvnc-platform/wayland"]

[dev-dependencies]
tempfile = "3"
openvnc-client.workspace = true

[lints]
workspace = true
