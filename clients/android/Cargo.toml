[package]
name = "openvnc-android"
description = "Cliente OpenVNC para Android (mesma GUI do desktop, com mouse virtual)."
# versao do APK (o Cargo.toml da raiz ainda diz 0.0.1); acompanha VERSION
version = "0.8.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "openvnc_android"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
openvnc-client.workspace = true
openvnc-protocol.workspace = true
openvnc-security.workspace = true
openvnc-core.workspace = true
openvnc-rfb.workspace = true
openvnc-transport.workspace = true
openvnc-framebuffer.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true
anyhow.workspace = true
winit = "0.30"
softbuffer = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["wgpu", "glow", "default_fonts", "android-native-activity"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["wgpu", "glow", "default_fonts"] }

[package.metadata.android]
package = "org.opencode.openvnc"
apk_name = "OpenVNC"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

[package.metadata.android.application]
label = "OpenVNC"

[package.metadata.android.application.activity]
config_changes = "orientation|screenSize|keyboardHidden"
orientation = "unspecified"
