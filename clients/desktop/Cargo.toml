[package]
name = "openvnc-desktop"
description = "Cliente VNC desktop (egui + wgpu)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "openvnc-desktop"
path = "src/main.rs"

[dependencies]
openvnc-client.workspace = true
openvnc-core.workspace = true
openvnc-rfb.workspace = true
openvnc-transport.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true
anyhow.workspace = true
openvnc-framebuffer.workspace = true
winit = "0.30"
softbuffer = "0.4"
eframe = { version = "0.31", default-features = false, features = ["wgpu", "glow", "default_fonts", "x11", "wayland"] }

[lints]
workspace = true

