[package]
name = "openvnc-codecs"
description = "Encodings RFB: Raw, CopyRect, Hextile, ZRLE, Tight."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
openvnc-core.workspace = true
openvnc-framebuffer.workspace = true
flate2.workspace = true
jpeg-decoder = { version = "0.3", default-features = false }
# H.264 compilado do fonte da Cisco (BSD-2); nenhum binario pre-compilado
openh264 = { version = "0.9", optional = true }

[features]
h264 = ["dep:openh264"]

[dev-dependencies]
criterion.workspace = true
openvnc-platform.workspace = true

[[bench]]
name = "codecs"
harness = false

[lints]
workspace = true
